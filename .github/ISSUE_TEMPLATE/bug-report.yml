name: Bug report
description: Reproduce a correctness, build, or concurrency problem
title: '[Bug] '
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and inputs to reproduce
      description: Include commit, command, dataset or fixture, K, seed, and initial centroids where relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include actual errors, test output, or measured evidence.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Java version, OS, CPU/core count, threshold and workers when relevant.
    validations:
      required: true
